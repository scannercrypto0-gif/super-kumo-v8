[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "aql"
version = "0.1.0"
description = "ATLAS Quant Lab — G1-WP01 minimal data pipeline"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "ruff>=0.9,<1",
    "hypothesis>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
