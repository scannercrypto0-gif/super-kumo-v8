[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "aql"
version = "0.1.0"
description = "ATLAS Quant Lab — G1-WP01 minimal data pipeline"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
backup = ["cryptography==50.0.2"]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
