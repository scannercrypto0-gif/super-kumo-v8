name: ATLAS H2 Local One-Shot Operator Gate (Synthetic Only)
on:
  push:
    branches: [integration/package-e-g1-g12-pinned-20261105]
    paths:
      - 'tools/atlas_h2_owner_local_one_shot_v1.py'
      - 'tests/test_atlas_h2_owner_local_one_shot_v1.py'
      - '.github/workflows/atlas-h2-owner-local-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-operator-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed authorization and local source denial tests (NO ORIGINAL DATA)
        shell: python
        run: |
          import sys,unittest
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          sys.path.insert(0,str(Path.cwd()/'tests'))
          suite=unittest.defaultTestLoader.loadTestsFromName(
              'test_atlas_h2_owner_local_one_shot_v1')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
