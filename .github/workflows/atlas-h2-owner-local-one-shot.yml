name: ATLAS H2 Local One-Shot Operator Gate (Synthetic Only)
on:
  push:
    branches: [integration/package-e-g1-g12-pinned-20261105]
    paths:
      - 'tools/atlas_h2_owner_local_one_shot_v1.py'
      - 'tests/test_atlas_h2_owner_local_one_shot_v1.py'
      - 'tools/atlas_h2_windows_one_shot.ps1'
      - '.github/workflows/atlas-h2-owner-local-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-operator-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed authorization and local source denial tests (NO ORIGINAL DATA)
        shell: python
        run: |
          import sys,unittest
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          sys.path.insert(0,str(Path.cwd()/'tests'))
          suite=unittest.defaultTestLoader.loadTestsFromName(
              'test_atlas_h2_owner_local_one_shot_v1')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)

      - name: Windows PowerShell launcher parse and no-manifest denial
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'tools/atlas_h2_windows_one_shot.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Out-String | Write-Host
            exit 1
          }
          try {
            & ./tools/atlas_h2_windows_one_shot.ps1 -PrivateManifest 'NOT_PRESENT' -OwnerHmacKey 'NOT_PRESENT' -AuditOutput 'NOT_PRESENT'
            throw 'FAIL_OPEN_MISSING_MANIFEST'
          } catch {
            if ($_.Exception.Message -notmatch 'OWNER_PRIVATE_MANIFEST_MISSING') { throw }
            Write-Host 'PASS: no manifest -> no local code fetch or source access'
          }
