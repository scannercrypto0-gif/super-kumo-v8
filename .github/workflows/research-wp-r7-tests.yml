name: Research WP-R7 Durable Evidence Tests

on:
  push:
    branches:
      - feat/research-wp-r7-durable-evidence-20261022
  pull_request:
    paths:
      - "research_wp_r0/**"
      - "tests/test_research_wp_r*.py"
      - ".github/workflows/research-wp-r7-tests.yml"

permissions:
  contents: read

jobs:
  durable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m compileall -q research_wp_r0 tests
      - run: python3 -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
