name: Research evidence gateway
on:
  pull_request:
    paths: ['tools/research_evidence_gateway/**', '.github/workflows/research-evidence-gateway.yml']
  push:
    branches: ['codex/pkg04-read-only-evidence-gateway']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -B -m pytest tools/research_evidence_gateway -q --basetemp=.gateway-tests --junitxml=gateway-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-${{ matrix.os }}
          path: gateway-tests.xml
