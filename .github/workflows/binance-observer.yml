name: Binance independent observer exact-head acceptance
on:
  pull_request:
    paths:
      - 'src/aql/**'
      - 'tests/test_binance_observer.py'
      - 'scripts/binance_independent_observer.py'
      - 'evidence/binance-observer-20261028/**'
      - '.github/workflows/binance-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Pin existing Factory boundary for cross-module acceptance
        run: git fetch --no-tags origin fbf70afbcf3ba051a9b1522328893bf9ab7f2a67
      - name: Exact commit and Core, Factory, G1 regressions
        shell: bash
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_binance_observer.py tests/test_data_proof*.py tests/test_core_*.py tests/test_g1_wp*.py tests/test_g1_completion.py tests/test_g1_integrity_58_59.py tests/test_g1_storage_02*.py --junitxml=observer-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-acceptance-${{ matrix.os }}
          path: observer-acceptance.xml
