name: Native prospective research seam
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/aql/observation/durable_bridge_v1.py'
      - 'src/aql/observation/prospective.py'
      - 'src/aql/observation/forward_evidence.py'
      - 'research_wp_r0/aql_factory_prospective_read_v1.py'
      - 'tests/test_atlas_prospective_native_seam.py'
      - '.github/workflows/atlas-prospective-native-seam.yml'
permissions:
  contents: read
jobs:
  native-prospective:
    name: Native prospective seam (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2
      - name: Native research read and reopen from generated input
        run: python -B -m pytest -q tests/test_atlas_prospective_native_seam.py
        env:
          PYTHONPATH: src
          BINANCE_LIVE_TEST: '0'
