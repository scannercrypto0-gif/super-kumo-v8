name: Core 178 Synthetic Contract
on:
  pull_request:
    paths:
      - 'research_wp_r0/core_dev_b0_*.py'
      - 'tests/test_core_178_*.py'
      - 'tests/test_core_dev_b0_integration.py'
      - '.github/workflows/core-178-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -B -m pytest -q --tb=short tests/test_core_178_synthetic_adapter.py tests/test_core_178_sensitivity.py tests/test_core_dev_b0_integration.py tests/test_research_handoff_174.py tests/test_core_dev_factory_binder.py tests/test_core_dev_source.py tests/test_core_factory_h01.py tests/test_realdev_integration_172.py tests/test_factory_dev_input_preflight.py tests/test_factory_dev_result_bundle.py tests/test_factory_dev_b0_warmup_252.py tests/test_factory_terminal_unknown_entry.py tests/test_factory_182_legacy_receipts.py
