name: Factory research consumer seam focused
on:
  push:
    branches:
      - factory/research-consumer-seam-v1-20261103
  pull_request:
    paths:
      - 'research_wp_r0/aql_factory_research_consumer_seam.py'
      - 'tests/test_aql_factory_research_consumer_seam.py'
      - '.github/workflows/aql-factory-research-consumer-seam.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_aql_factory_research_consumer_seam.py' -v
