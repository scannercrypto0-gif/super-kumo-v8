name: SF Integrity Stage Gate
on:
  pull_request:
    paths:
      - 'research_wp_r0/**'
      - '.github/workflows/sf-integrity-stage-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pytest-timeout
      - name: Exact source and environment
        shell: bash
        run: |
          git rev-parse HEAD | tee factory-admission-source.txt
          git rev-parse 'HEAD^{tree}' | tee -a factory-admission-source.txt
          python --version | tee -a factory-admission-source.txt
          python -m pip freeze | tee -a factory-admission-source.txt
      - name: Compile Factory sources and enforce dependency boundary
        run: |
          python -m compileall -q research_wp_r0
          python -B research_wp_r0/_dep_guard.py research_wp_r0/attempt_ledger.py research_wp_r0/frozen_attempt_writer.py
      - name: Full Factory regression including adversarial default admission
        run: python -B -m pytest -p no:cacheprovider research_wp_r0 -v --tb=short --junitxml=factory-admission.xml
      - name: Verify complete matrix evidence
        run: python -B -c "import xml.etree.ElementTree as E; s=E.parse('factory-admission.xml').getroot().find('testsuite'); print(s.attrib); assert len(s.findall('testcase')) == 61; assert all(int(s.get(k,0)) == 0 for k in ('failures','errors','skipped'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-admission-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            factory-admission-source.txt
            factory-admission.xml
