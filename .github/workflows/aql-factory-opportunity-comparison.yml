name: Factory opportunity comparison #250
on:
  push:
    paths:
      - 'research_wp_r0/aql_factory_opportunity_comparison_gate.py'
      - 'tests/test_aql_factory_opportunity_comparison_gate.py'
      - '.github/workflows/aql-factory-opportunity-comparison.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_factory_opportunity_comparison_gate.py'
      - 'tests/test_aql_factory_opportunity_comparison_gate.py'
      - '.github/workflows/aql-factory-opportunity-comparison.yml'
  workflow_dispatch:
jobs:
  opportunity-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run bounded Factory #250 tests
        run: python -m unittest discover -s tests -p test_aql_factory_opportunity_comparison_gate.py -v
