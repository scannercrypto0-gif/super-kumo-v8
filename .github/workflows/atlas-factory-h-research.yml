name: ATLAS Factory H Research Backtest and Lab (not F5)
on:
  push:
    branches:
      - factory/package-e-historical-research-results-20261105
    paths:
      - 'research_wp_r0/aql_factory_h_trade_event_ledger_v1.py'
      - 'research_wp_r0/aql_factory_h_scientific_lab_v1.py'
      - 'research_wp_r0/aql_factory_h_research_package_v1.py'
      - 'research_wp_r0/aql_factory_h_scientific_lab_v1.py'
      - 'tests/test_aql_factory_h_research_package_v1.py'
      - 'docs/research/factory-package-h-historical-lab-v1-20261107.md'
      - '.github/workflows/atlas-factory-h-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-h-new-delta:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Historical research H ledger Lab and sealed replay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p test_aql_factory_h_research_package_v1.py -v
