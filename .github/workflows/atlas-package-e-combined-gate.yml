      - name: Verify Windows one-command PowerShell syntax and Python import syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/atlas_f2_owner_run.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw 'PINNED_OWNER_POWERSHELL_SYNTAX_INVALID'
          }
          python -m py_compile tools/atlas_f2_owner_provenance_v1.py tools/atlas_f2_owner_factory_packet_v1.py tools/atlas_f2_owner_execute.py tools/atlas_f2_stage_owner_overlay.py
          if ($LASTEXITCODE -ne 0) {
            throw 'OWNER_PYTHON_MODULE_SYNTAX_INVALID'
          }
      - name: Execute Windows pinned Factory v2 SQLite first-replay and owner negative operator tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tests"
          python -m unittest discover -s tests -p 'test_aql_factory_f_f2_recovery_research_v2.py' -v
          python -m unittest discover -s tests -p 'test_atlas_f2_owner_execute_v1.py' -v
  normalized-parity:
    needs: [bounded-e,windows-owner-operator-syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e-gate-*
          path: evidence
      - name: Verify normalized SHA across 3 Python interpreters
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=sorted(Path('evidence').glob('*/e-gate-evidence.json'))
          assert len(paths)==3, paths
          reports=[json.loads(p.read_text()) for p in paths]
          perf_paths=sorted(Path('evidence').glob('*/e-factory-performance.json'))
          assert len(perf_paths)==3, perf_paths
          performances=[json.loads(p.read_text()) for p in perf_paths]
          assert all(q['threshold_pass'] and q['experiment_count']==96 and
                     q['attempts_count']==384 and q['strategy_count']==12 and
                     q['symbol_count']==8 and q['orders_created']==0 and
                     q['trading_authority']=='NONE' for q in performances)
          perf_shas={q['document_set_sha256'] for q in performances}
          assert len(perf_shas)==1, perf_shas
          print('ATLAS_E_CROSS_VERSION_BENCHMARK_SHA256='+next(iter(perf_shas)))
          versions={x['python'].split('.')[0]+'.'+x['python'].split('.')[1] for x in reports}
          assert versions=={'3.11','3.12','3.13'}, versions
          sha={x['normalized_sha256'] for x in reports}
          assert len(sha)==1, sha
          for x in reports:
              body=json.dumps(x['normalized'],sort_keys=True,separators=(',',':'),
                              ensure_ascii=True,allow_nan=False).encode()
              assert hashlib.sha256(body).hexdigest()==x['normalized_sha256']
              assert x['normalized']['historical_source']=='HISTORICAL_SOURCE_BLOCKED'
              assert x['normalized']['final_package_e']=='CLOSED_ENGINEERING_WITH_EXTERNAL_HISTORICAL_BLOCKERS'
          print('ATLAS_E_CROSS_VERSION_NORMALIZED_SHA256='+next(iter(sha)))
          print('E_ENGINEERING_BOUNDED_PASS_WITH_HISTORICAL_BLOCKERS')
          PY
