name: ATLAS Package E One Pinned Cross-Owner Combined Gate
on:
  push:
    branches:
      - integration/package-e-g1-g12-pinned-20261105
    paths:
      - 'tools/atlas_e_combined_gate_manifest.py'
      - 'tools/atlas_f_research_diagnostic_operator.py'
      - 'tools/atlas_f2_recovery_evidence_v1.py'
      - 'tools/atlas_f2_owner_private_preflight.ps1'
      - 'tools/atlas_f2_owner_provenance_v1.py'
      - 'tools/atlas_f2_owner_factory_packet_v1.py'
      - 'tools/atlas_f2_owner_execute.py'
      - 'tools/atlas_f2_stage_owner_overlay.py'
      - 'tools/atlas_f2_owner_run.ps1'
      - 'tests/test_atlas_f2_owner_execute_v1.py'
      - 'docs/research/owner-f2-recovery-real-one-command-20261107.md'
      - 'tools/atlas_f2_recovery_research_operator.py'
      - 'tests/test_atlas_f2_recovery_evidence_v1.py'
      - 'tests/test_atlas_f2_recovery_research_operator.py'
      - 'tests/test_atlas_f_research_diagnostic_operator.py'
      - 'docs/research/integration-f-research-diagnostic-one-command-20261107.md'
      - 'docs/research/package-e-combined-gate-evidence-scope.md'
      - 'docs/research/package-f-original-cohort-one-run-e2e-runbook-v1.md'
      - '.github/workflows/atlas-package-e-combined-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {ref: 0ec35238de6cf48db07c5c977e1f0d04bc299f58, path: _pinned_factory_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 998e3bcca8ca6f1150964dfa9d94726fec96b846, path: _pinned_core_f, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 7bf0107a321c3018700e0dc7a5c7a6f0ecbaaa8e, path: _pinned_scanner_f, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 1cb70f1212283fe34117882d18e0501fc6409fe7, path: _pinned_discoverer_f, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: a86a590a5e2c32c18e03522f52896dbcf50c60ff, path: _pinned_core_d, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 3af5b66d2b381b853a6b5be32c38b3d3d02e1ea7, path: _pinned_core_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: a91e370ae7e5197e9af71f8300eeaff4a7aff022, path: _pinned_scanner_d, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: a2aa9c195095bcfe852fdc760e385ccb2acf3d5d, path: _pinned_scanner_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 1659713c80d1934f3c08af1af422b89cd5706360, path: _pinned_scanner_c, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 30c37ae56851488b882998c7fa0085ec51dbfc92, path: _pinned_scanner_b, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 149ca90c09b96abb45d3bc2839b657711c9826ac, path: _pinned_discoverer_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: f2006c0e431690ccea8b0532095bf4f2a2dc88ba, path: _pinned_discoverer_base, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 6acbcc7fc243b132f58170df4c6469bbf7f4eff8, path: _pinned_work235, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 7d97b09c0c6ee2650a61d523acb8d8c771a99c46, path: _pinned_raw211, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: b9c9ff8602e79c534402f44bce83c56ec2fa6bb9, path: _pinned_scanner227, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: e368dd491a0d80618bdc6c6e8f731a195d763dda, path: _pinned_raw_windows_lock, persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stage pinned read-only owner dependencies and exact tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile, copytree
          owners=('_pinned_core_f','_pinned_scanner_f','_pinned_discoverer_f',
                  '_pinned_core_e','_pinned_core_d','_pinned_scanner_e',
                  '_pinned_scanner_d','_pinned_scanner_c','_pinned_scanner_b',
                  '_pinned_discoverer_e','_pinned_discoverer_base',
                  '_pinned_work235','_pinned_raw211','_pinned_scanner227')
          for owner in owners:
              for folder in ('research_wp_r0','tools','src'):
                  source=Path(owner)/folder
                  if not source.is_dir(): continue
                  for item in source.rglob('*.py'):
                      target=Path(folder)/item.relative_to(source)
                      if not target.exists():
                          target.parent.mkdir(parents=True,exist_ok=True)
                          copyfile(item,target)
          # Exact pinned owner HEADs are mandatory before importing any operator.
          from tools.atlas_e_combined_gate_manifest import PINS
          for key in ('factory_e','core_f','scanner_f'):
              import subprocess
              actual=subprocess.check_output(['git','-C','_pinned_'+key,'rev-parse','HEAD'],text=True).strip()
              assert actual==PINS[key], ('OWNER_HEAD_PIN_DRIFT',key,actual,PINS[key])
          # F HEAD precedence: fail closed if a stale base or historical overlay
          # shadows the pinned F modules. Historical owners fill missing paths only.
          import hashlib
          authoritative = {
              '_pinned_core_f': (
                  'research_wp_r0/aql_core_f_bulk_source_v1.py',
                  'research_wp_r0/aql_core_f5_secretary_authority_v1.py',
                  'research_wp_r0/aql_core_f_research_diagnostic_query_v1.py',
                  'research_wp_r0/aql_core_f_recovery_readonly_v1.py',
                  'research_wp_r0/aql_core_backbone_local_v1.py',
                  'tests/test_aql_core_f_recovery_readonly_v1.py',
                  'tests/test_aql_core_f_research_diagnostic_query_v1.py',
                  'tests/test_aql_core_f5_secretary_authority_v1.py',
              ),
              '_pinned_scanner_f': (
                  'tools/scanner_strategy_f/independent_policy_verification.py',
                  'tools/scanner_strategy_f/source_bound_intake.py',
                  'tools/scanner_strategy_f/secretary_factory_handoff.py',
                  'tools/scanner_strategy_f/strategy_specific_decision.py',
                  'tools/scanner_strategy_f/secretary_ack_requirements.py',
                  'tools/scanner_strategy_f/independent_evaluator_nomination.py',
                  'tools/scanner_strategy_f/test_independent_evaluator_nomination.py',
                  'tools/scanner_strategy_f/private_operator_bundle.py',
                  'tools/scanner_strategy_f/research_e2e_diagnostic.py',
                  'tools/scanner_strategy_f/recovery_diagnostic_adapter.py',
                  'tools/scanner_strategy_f/frozen_diagnostic_contracts.py',
                  'tools/scanner_strategy_f/test_recovery_diagnostic_adapter.py',
                  'tools/scanner_strategy_f/test_research_e2e_diagnostic.py',
                  'tools/scanner_strategy_f/test_private_operator_bundle.py',
                  'tools/scanner_strategy_f/test_strategy_specific_decision.py',
              ),
              '_pinned_discoverer_f': (
                  'tools/strategy_discoverer_offline/historical_f4_intake.py',
              ),
          }
          for owner, paths in authoritative.items():
              for relative in paths:
                  source, target = Path(owner)/relative, Path(relative)
                  assert source.is_file(), ('MISSING_PINN_F_FILE', owner, relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  copyfile(source, target)
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  assert hashlib.sha256(target.read_bytes()).hexdigest() == digest, (
                      'STALE_F_OVERLAY', owner, relative)
                  print('PINNED_F_FILE_SHA256', owner, relative, digest)
          # RawVault Windows fix is an explicitly separate, pinned dependency.
          # Stage the entire canonical package (not a standalone vault.py).
          raw_base=Path('_pinned_raw211/tools/raw_vault_offline')
          raw_fixed=Path('_pinned_raw_windows_lock/tools/raw_vault_offline')
          assert raw_base.is_dir() and raw_fixed.is_dir(), 'RAW_VAULT_PACKAGE_MISSING'
          for relative in ('__init__.py','schema.py','vault.py'):
              src=raw_fixed/relative
              assert src.is_file(), ('RAW_VAULT_PIN_MISSING',relative)
              dst=Path('tools/raw_vault_offline')/relative
              dst.parent.mkdir(parents=True,exist_ok=True)
              copyfile(src,dst)
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==hashlib.sha256(src.read_bytes()).hexdigest(), ('RAW_VAULT_BYTES_MISMATCH',relative)
          # Historical #211 helpers stay from canonical parent; verify those
          # dependencies share the same Git blob, rather than merging branches.
          for relative in ('__init__.py','schema.py'):
              assert (raw_base/relative).read_bytes()==(raw_fixed/relative).read_bytes(), ('RAW_VAULT_API_DIVERGENCE',relative)
          assert hashlib.sha1(b'blob '+str((raw_fixed/'vault.py').stat().st_size).encode()+bytes([0])+(raw_fixed/'vault.py').read_bytes()).hexdigest()=='6b5bcc1d684088934f5ed7110064380b8d2bc0cd', 'RAW_VAULT_BLOB_MISMATCH'
          # Exact Factory E owner HEAD is the source for its own modules/tests;
          # integration branch never changes the Factory owner branch.
          for name in ('aql_factory_e_research_results_store_v1.py',
                       'aql_factory_e_discoverer_consumer_v1.py',
                       'aql_factory_e_historical_source_boundary_v1.py',
                       'aql_factory_e_core_scanner_historical_wait_v1.py',
                       'aql_factory_e_durable_discoverer_consumer_v1.py',
                       'aql_factory_f_batch_ledger_v1.py',
                       'aql_factory_f_scanner_bulk_consumer_v1.py',
                       'aql_factory_f_private_original_cohort_v1.py',
                       'aql_factory_f_role_authority_v1.py',
                       'aql_factory_f_research_e2e_diagnostic_v1.py',
                       'aql_factory_f_f2_recovery_diagnostic_v1.py',
                       'aql_factory_f_f2_recovery_research_v2.py',
                       'aql_factory_historical_rule_projection.py',
                       'strategy_definition.py',
                       'indicator_library_v2.py'):
              source=Path('_pinned_factory_e')/'research_wp_r0'/name
              target=Path('research_wp_r0')/name
              assert source.is_file(), ('PINNED_FACTORY_MODULE_MISSING',name)
              copyfile(source,target)
              assert hashlib.sha256(source.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest(), ('PINNED_FACTORY_BYTES_DRIFT',name)
          copyfile(Path('_pinned_scanner_e')/'tools/scanner_strategy_e/historical_policy_approval_request.py',
                   Path('tools/scanner_strategy_e/historical_policy_approval_request.py'))
          copyfile(Path('_pinned_factory_e')/'tools/atlas_factory_e_bounded_perf.py',
                   Path('tools/atlas_factory_e_bounded_perf.py'))
          for name in ('test_aql_factory_e_research_results_store_v1.py',
                       'test_aql_factory_e_discoverer_consumer_v1.py',
                       'test_aql_factory_e_historical_source_boundary_v1.py',
                       'test_aql_factory_e_core_scanner_historical_wait_v1.py',
                       'test_aql_factory_e_durable_discoverer_consumer_v1.py',
                       'test_aql_factory_e_migration_v1.py',
                       'test_aql_factory_e_bounded_perf_v1.py',
                       'test_aql_factory_f_batch_ledger_v1.py',
                       'test_aql_factory_f_scanner_bulk_consumer_v1.py',
                       'test_aql_factory_f_private_original_cohort_v1.py',
                       'test_aql_factory_f_role_authority_v1.py',
                       'test_aql_factory_f_research_e2e_diagnostic_v1.py',
                       'test_aql_factory_f_f2_recovery_diagnostic_v1.py',
                       'test_aql_factory_f_f2_recovery_research_v2.py'):
              source=Path('_pinned_factory_e')/'tests'/name
              target=Path('tests')/name
              assert source.is_file(), ('PINNED_FACTORY_TEST_MISSING',name)
              copyfile(source,target)
              assert hashlib.sha256(source.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest(), ('PINNED_FACTORY_TEST_BYTES_DRIFT',name)
          copytree(Path('_pinned_work235')/'tools/strategy_service_offline/fixtures',
                   Path('tools/strategy_service_offline/fixtures'),dirs_exist_ok=True)
          for name in ('test_aql_core_d_same_source_v1.py',
                       'test_aql_core_d_permitted_cohort_v1.py',
                       'test_aql_core_d_canonical_secretary_v1.py'):
              copyfile(Path('_pinned_core_d')/'tests'/name,Path('tests')/name)
          copyfile(Path('_pinned_core_e')/'tests/test_aql_core_e_historical_boundary_v1.py',
                   Path('tests/test_aql_core_e_historical_boundary_v1.py'))
          copyfile(Path('_pinned_core_e')/'tests/test_aql_core_e_status_evidence_v1.py',
                   Path('tests/test_aql_core_e_status_evidence_v1.py'))
          assert Path('research_wp_r0/aql_core_f_bulk_source_v1.py').is_file()
          assert Path('tools/scanner_strategy_f/retrospective_policy.py').is_file()
          assert Path('tools/strategy_discoverer_offline/historical_f4_intake.py').is_file()
          assert Path('tools/scanner_strategy_e/test_historical_core_screening.py').is_file()
          assert Path('tools/strategy_discoverer_offline/tests/test_package_e_membership.py').is_file()
          import importlib
          imported=importlib.import_module('tools.raw_vault_offline.vault')
          imported_path=Path(imported.__file__).resolve()
          pinned_path=Path('tools/raw_vault_offline/vault.py').resolve()
          assert imported_path==pinned_path, ('RAW_VAULT_IMPORT_SHADOW',str(imported_path))
          assert hashlib.sha256(imported_path.read_bytes()).hexdigest()==hashlib.sha256((raw_fixed/'vault.py').read_bytes()).hexdigest(), 'RAW_VAULT_IMPORT_BYTES_MISMATCH'
          print('RAW_VAULT_WINDOWS_FIX_PINNED',imported_path,hashlib.sha256(imported_path.read_bytes()).hexdigest())
          print('All E owner interfaces staged read-only from exact SHA heads')
          PY
      - name: Install test-only pytest and Scanner Ed25519 verifier dependency
        run: python -m pip install pytest cryptography
      - name: ONE combined bounded E software gate
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD:$PWD/tests:$PWD/_pinned_raw211"
          python -m unittest discover -s tests -p 'test_aql_factory_d_canonical_consumer_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_research_results_store_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_discoverer_consumer_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_core_e_historical_boundary_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_historical_source_boundary_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_core_scanner_historical_wait_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_durable_discoverer_consumer_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_migration_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_batch_ledger_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_scanner_bulk_consumer_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_private_original_cohort_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_role_authority_v1.py' -v
          python -m unittest tools.scanner_strategy_f.test_bulk_census -v
          python -m unittest tools.scanner_strategy_f.test_independent_policy_verification -v
          python -m unittest tools.scanner_strategy_f.test_source_bound_intake -v
          python -m unittest tools.scanner_strategy_f.test_secretary_factory_handoff -v
          python -m unittest tools.scanner_strategy_f.test_strategy_specific_decision -v
          python -m unittest tools.scanner_strategy_f.test_independent_evaluator_nomination -v
          python -m unittest tools.scanner_strategy_f.test_private_operator_bundle -v
          python -m unittest tools.scanner_strategy_f.test_research_e2e_diagnostic -v
          python -m unittest discover -s tests -p 'test_aql_core_f_research_diagnostic_query_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_research_e2e_diagnostic_v1.py' -v
          python -m unittest discover -s tests -p 'test_atlas_f_research_diagnostic_operator.py' -v
          python -m unittest discover -s tests -p 'test_atlas_f2_recovery_evidence_v1.py' -v
          python -m unittest discover -s tests -p 'test_atlas_f2_recovery_research_operator.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_f2_recovery_research_v2.py' -v
          python -m unittest discover -s tests -p 'test_atlas_f2_owner_execute_v1.py' -v
          python -m unittest discover -s tests -p 'test_atlas_integration_comprehensive_preflight.py' -v
          python -m tools.atlas_integration_comprehensive_preflight
          python -m compileall -q tools/atlas_f2_owner_provenance_v1.py tools/atlas_f2_owner_factory_packet_v1.py tools/atlas_f2_owner_execute.py tools/atlas_f2_stage_owner_overlay.py
          python -m unittest discover -s tests -p 'test_aql_core_f_recovery_readonly_v1.py' -v
          python -m unittest tools.scanner_strategy_f.test_recovery_diagnostic_adapter -v
          python -m unittest discover -s tests -p 'test_aql_factory_f_f2_recovery_diagnostic_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_core_f5_secretary_authority_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_factory_e_bounded_perf_v1.py' -v
          python -m pytest tools/strategy_discoverer_offline/tests/test_package_e_durable_checkpoint.py -q
          python -m unittest discover -s tests -p 'test_aql_core_e_status_evidence_v1.py' -v
          python -m unittest tools.scanner_strategy_e.test_historical_research_policy -v
          python tools/atlas_factory_e_bounded_perf.py --strategies 12 --symbols 8 --per-pair 4 --max-seconds 30 --max-peak-mib 96 --output e-factory-performance.json
          python -m unittest tools.scanner_strategy_e.test_historical_core_screening -v
          python -m pytest tools/strategy_discoverer_offline/tests/test_package_e_membership.py -q
          python tools/atlas_e_combined_gate_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: e-gate-${{ matrix.python-version }}
          path: |
            e-gate-evidence.json
            e-factory-performance.json
          if-no-files-found: error
          retention-days: 14
