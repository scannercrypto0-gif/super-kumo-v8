          from pathlib import Path
          import hashlib, subprocess, shutil
          owners={
            '_pinned_factory_e':'0ec35238de6cf48db07c5c977e1f0d04bc299f58',
            '_pinned_core_f':'998e3bcca8ca6f1150964dfa9d94726fec96b846',
