name: G2 retained source offline handoff
on:
  pull_request:
    paths:
      - "src/aql/observation/retained_source.py"
      - "tests/test_g2_retained_source.py"
      - "docs/core/g2_retained_source.md"
      - ".github/workflows/g2-retained-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest pytest-timeout
      - name: Exact head focused acceptance
        run: |
          git rev-parse HEAD
          python --version
          python -m pytest tests/test_g2_retained_source.py tests/test_g2_observation_worker.py tests/test_g2_position_journal.py -q --timeout=30 --junitxml=retained-source-results.xml
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-retained-source-${{ matrix.os }}
          path: retained-source-results.xml
          if-no-files-found: error
