name: Scanner Engine Offline CI

# Scope: tools/scanner_engine_offline/** ONLY
# No network calls, no live market data, no paper trading.
# This workflow is fully offline — all tests use deterministic synthetic fixtures.

on:
  push:
    branches:
      - feat/scanner-engine-offline-v1
    paths:
      - "tools/scanner_engine_offline/**"
      - ".github/workflows/scanner-offline-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "tools/scanner_engine_offline/**"
      - ".github/workflows/scanner-offline-ci.yml"

env:
  # Enforce no accidental network calls from Python tests
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  scanner-offline-tests:
    name: Scanner Offline — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify isolated namespace (no src/aql imports)
        run: |
          # Fail fast if scanner code accidentally imports from protected namespaces
          ! grep -r "from src.aql" tools/scanner_engine_offline/ || \
            (echo "ISOLATION VIOLATION: src/aql import found" && exit 1)
          ! grep -r "from research_wp_r0" tools/scanner_engine_offline/ || \
            (echo "ISOLATION VIOLATION: research_wp_r0 import found" && exit 1)

      - name: Verify publishable/delivery_authorized safety constraints
        run: |
          # Every assignment of publishable must be False
          python - <<'EOF'
          import re, pathlib, sys
          issues = []
          for f in pathlib.Path("tools/scanner_engine_offline").rglob("*.py"):
              text = f.read_text()
              # Find any publishable=True or delivery_authorized=True
              if re.search(r'publishable\s*=\s*True', text):
                  issues.append(f"{f}: publishable=True found")
              if re.search(r'delivery_authorized\s*=\s*True', text):
                  issues.append(f"{f}: delivery_authorized=True found")
          if issues:
              print("SAFETY CONSTRAINT VIOLATIONS:")
              for i in issues:
                  print(f"  {i}")
              sys.exit(1)
          print("Safety check passed: publishable and delivery_authorized are never True")
          EOF

      - name: Run scanner offline tests
        run: |
          python -m pytest tools/scanner_engine_offline/tests/ \
            -v \
            --tb=short \
            --strict-markers \
            -p no:cacheprovider

      - name: Run demo (smoke test — no network)
        run: |
          python -m tools.scanner_engine_offline.demo 2>&1 | python - <<'EOF'
          import sys, json
          data = json.loads(sys.stdin.read())
          assert data.get("publishable_check") is True, "publishable_check must be True (all False)"
          assert data.get("delivery_authorized_check") is True, "delivery_authorized_check must be True (all False)"
          assert "run_id" in data, "run_id missing from demo output"
          print(f"Demo smoke test passed: run_id={data['run_id']}, nominated={data.get('nominated_count', 0)}")
          EOF

  scanner-offline-lint:
    name: Scanner Offline — Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install pyflakes

      - name: Pyflakes — scan for undefined names and unused imports
        run: |
          python -m pyflakes tools/scanner_engine_offline/ 2>&1 || true
          # Non-blocking: report only — lint errors do not block the PR
          echo "Lint step complete (non-blocking)"
