name: Core G1-G2 Durable Observation Synthetic
on:
  push:
    branches:
      - aql-core-g1-g2-observation-b-20261109
  pull_request:
    paths:
      - src/aql/observation/durable_bridge_v1.py
      - tests/test_g1_g2_durable_bridge_v1.py
      - tests/test_g1_g2_scanner_exact_head.py
      - .github/workflows/core-g1-g2-durable-observation.yml
jobs:
  g1-g2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout pinned actual Scanner #277 source (GitHub code only)
        uses: actions/checkout@v4
        with:
          ref: 0251dc0bb89eb9e501225653a85f7ead90ce06a8
          path: scanner-ref
          persist-credentials: false
      - name: Focused offline G1 to G2 contract tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_g1_g2_durable_bridge_v1.py' -v
      - name: Actual pinned Scanner producer to Core consumer synthetic integration
        shell: bash
        env:
          AQL_PINNED_SCANNER_ROOT: scanner-ref
        run: python -m unittest discover -s tests -p 'test_g1_g2_scanner_exact_head.py' -v
