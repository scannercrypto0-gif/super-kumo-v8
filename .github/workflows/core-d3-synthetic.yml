name: Core D3 synthetic archive focused
on:
  pull_request:
    paths:
      - 'src/aql/d3_*.py'
      - 'tests/test_d3_*.py'
      - '.github/workflows/core-d3-synthetic.yml'
  workflow_dispatch:
jobs:
  d3-focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run only D3 acceptance
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_d3_synthetic_archive.py tests/test_d3_offline_archive.py tests/test_d3_g1_sidecopy.py tests/test_d3_publication_validation.py tests/test_d3_g1_sqlite_integration.py
