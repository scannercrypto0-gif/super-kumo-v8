name: Research WP-R6 Trial Holdout Tests

on:
  push:
    branches:
      - feat/research-wp-r6-trial-holdout-20261022

permissions:
  contents: read

jobs:
  trial-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m compileall -q research_wp_r0 tests
      - run: python3 -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
