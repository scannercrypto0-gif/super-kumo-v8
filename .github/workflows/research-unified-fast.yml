name: Research Unified Fast CI

on:
  push:
    branches:
      - ci/research-unified-fast-suite-20261022
      - ci/research-wp-r17-fast-path-20261022
      - ci/research-r18-targeted-performance-20261022
  pull_request:
    paths:
      - "research_wp_r0/**"
      - "tests/test_research_wp_r*.py"
      - ".github/workflows/research-unified-fast.yml"
      - ".github/workflows/research-targeted-performance.yml"
      - ".github/workflows/research-wp-r*-tests.yml"
      - ".github/workflows/research-audit-remediation.yml"
  workflow_dispatch:
    inputs:
      deep_smoke:
        description: 'Run three extra synthetic E2E commands (already covered in unit acceptance tests)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Full research fast suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python
        run: python --version
      - name: All research regression tests, exactly once per OS
        run: python -B -m unittest discover -s tests -p 'test_research_wp_r*.py'
      - name: Reproducible synthetic Strategy Factory Batch 01
        run: python -B -m research_wp_r0.strategy_factory --output strategy-factory-batch01-artifacts
      - name: Preserve Batch 01 results and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: strategy-factory-batch01-${{ matrix.os }}
          path: strategy-factory-batch01-artifacts/
          if-no-files-found: error
      - name: End-to-end research evidence and checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_smoke == true }}
        run: python -B -m research_wp_r0.measured_pipeline
      - name: Disposable telemetry loss isolation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_smoke == true }}
        run: python -B -m research_wp_r0.isolated_telemetry
      - name: Telemetry queue backpressure and worker failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_smoke == true }}
        run: python -B -m research_wp_r0.telemetry_pressure
