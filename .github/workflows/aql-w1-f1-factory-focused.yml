name: AQL W1 F1 Factory Focused Consumer
on:
  push:
    branches:
      - aql/w1-factory-research-consumer-20261031
  workflow_dispatch:

jobs:
  f1-factory-consumer-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned Core baseline
        uses: actions/checkout@v4
        with:
          ref: a592ff1c7ccdcc67d400badf093feebceefbdcb9
          path: compatible
          persist-credentials: false
      - name: Checkout Factory exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: factory
          persist-credentials: false
      - name: Overlay only prospective consumer and focused tests
        shell: bash
        run: |
          set -euo pipefail
          cp factory/research_wp_r0/aql_w1_f1_prospective_consumer.py compatible/research_wp_r0/
          cp factory/tests/test_aql_w1_f1_prospective_consumer.py compatible/tests/
          cp factory/tests/test_aql_w1_f1_core_integration.py compatible/tests/
          cd compatible
          test "$(git rev-parse HEAD)" = "a592ff1c7ccdcc67d400badf093feebceefbdcb9"
          echo "PINNED_CORE_SHA=$(git rev-parse HEAD)"
          echo "FACTORY_HEAD_SHA=${{ github.sha }}"
          git add research_wp_r0/aql_w1_f1_prospective_consumer.py tests/test_aql_w1_f1_prospective_consumer.py tests/test_aql_w1_f1_core_integration.py
          echo "COMBINED_TREE_SHA=$(git write-tree)"
          git hash-object research_wp_r0/aql_w1_f1_prospective_consumer.py
          git hash-object tests/test_aql_w1_f1_prospective_consumer.py
          git hash-object tests/test_aql_w1_f1_core_integration.py
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only F1 Factory consumer focused tests
        working-directory: compatible
        run: python -m unittest -v tests.test_aql_w1_f1_prospective_consumer tests.test_aql_w1_f1_core_integration
