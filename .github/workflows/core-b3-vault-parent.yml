name: Core B3 pinned F1 Vault parent seam
on:
  push:
    branches:
      - aql/core-f1-prospective-capture-20261101
    paths:
      - 'research_wp_r0/aql_f1_b3_vault_parent_adapter.py'
      - 'examples/aql_f1_b3_emit_vault_parent.py'
      - 'tests/test_aql_f1_b3_vault_parent.py'
      - '.github/workflows/core-b3-vault-parent.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_f1_b3_vault_parent_adapter.py'
      - 'examples/aql_f1_b3_emit_vault_parent.py'
      - 'tests/test_aql_f1_b3_vault_parent.py'
      - '.github/workflows/core-b3-vault-parent.yml'
permissions:
  contents: read
jobs:
  changed-legacy-scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.delta.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: delta
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import os,re,subprocess
          from research_wp_r0.aql_r5b_run_authorization import legacy_delta_needed
          base=os.environ.get('BEFORE_SHA','')
          if not re.fullmatch(r'[a-f0-9]{40}',base) or subprocess.run(['git','cat-file','-e',base],capture_output=True).returncode:
              base='17f2c45bc63f688b81c761e250b5d7685e25063f'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          required=os.environ.get('EVENT_KIND')=='workflow_dispatch' or legacy_delta_needed(changed,['research_wp_r0/aql_f1_b3_vault_parent_adapter.py', 'examples/aql_f1_b3_emit_vault_parent.py', 'tests/test_aql_f1_b3_vault_parent.py'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('required='+str(required).lower()+'\n')
          print('LEGACY_SCOPE_REQUIRED='+str(required)+' CHANGED='+repr(changed))
          PYCODE
  b3-real-vault-seam:
    needs: changed-legacy-scope
    if: needs.changed-legacy-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2ddfb2f4a6e145c6579820beb03e4d678594de21
          path: .vault-pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Overlay only actual pinned RawVault schema and vault module
        run: |
          echo "CORE_CURRENT_SHA=$(git rev-parse HEAD)"
          echo "VAULT_PINNED_SHA=$(git -C .vault-pin rev-parse HEAD)"
          test "$(git -C .vault-pin rev-parse HEAD)" = 2ddfb2f4a6e145c6579820beb03e4d678594de21
          mkdir -p tools/raw_vault_offline
          cp .vault-pin/tools/raw_vault_offline/schema.py tools/raw_vault_offline/schema.py
          cp .vault-pin/tools/raw_vault_offline/vault.py tools/raw_vault_offline/vault.py
          test -f tools/raw_vault_offline/__init__.py || touch tools/raw_vault_offline/__init__.py
          python -m unittest -v tests.test_aql_f1_b3_vault_parent
          mkdir -p b3_evidence
          PYTHONPATH=. python examples/aql_f1_b3_emit_vault_parent.py --out b3_evidence/core-b3-vault-parent.json
          sha256sum b3_evidence/core-b3-vault-parent.json
      - name: Preserve exact B3 Core Vault manifest handoff bytes
        uses: actions/upload-artifact@v4
        with:
          name: core-b3-pinned-vault-parent-handoff
          path: b3_evidence/core-b3-vault-parent.json
          retention-days: 30
