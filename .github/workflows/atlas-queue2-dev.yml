name: ATLAS Queue 2 synthetic DEV
on:
  pull_request:
    paths:
      - .github/workflows/atlas-queue2-dev.yml
      - research_wp_r0/**
      - tools/atlas_queue2_dev.py
      - tools/atlas_factory_pkg02_execution_smoke.py
      - tools/raw_vault_offline/**
      - tools/scanner_strategy_d/**
      - tools/strategy_service_offline/**
      - tests/test_aql_p2_core_producer.py
      - tests/test_aql_p2_factory_lab.py
      - tests/test_aql_factory_pkg02_execution_comparison_v1.py
      - tests/test_atlas_queue2_dev.py
permissions:
  contents: read
jobs:
  native-dev-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pytest-timeout
      - name: Test the changed Core, Factory, costs and publication boundaries
        run: python -B -m pytest -q tests/test_aql_p2_core_producer.py tests/test_aql_p2_factory_lab.py tests/test_aql_factory_pkg02_execution_comparison_v1.py tests/test_atlas_queue2_dev.py
      - name: Produce and reopen sealed native synthetic evidence
        run: |
          python -B tools/atlas_queue2_dev.py queue2-evidence
          python -B tools/atlas_queue2_dev.py --readback queue2-evidence
          python -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("queue2-evidence/evidence.json").read_bytes()).hexdigest())'
      - uses: actions/upload-artifact@v4
        with:
          name: queue2-native-dev
          path: queue2-evidence/
          if-no-files-found: error
  native-dev-windows-readback:
    needs: native-dev-producer
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .;src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pytest-timeout
      - uses: actions/download-artifact@v4
        with:
          name: queue2-native-dev
          path: queue2-evidence
      - name: Test portable consumers and reopen the Ubuntu source artifact
        run: |
          python -B -m pytest -q tests/test_aql_p2_core_producer.py tests/test_aql_p2_factory_lab.py tests/test_aql_factory_pkg02_execution_comparison_v1.py tests/test_atlas_queue2_dev.py
          python -B tools/atlas_queue2_dev.py --readback queue2-evidence
