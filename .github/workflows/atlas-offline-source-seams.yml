name: ATLAS offline source seams
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/aql/collector/research_ws.py'
      - 'research_wp_r0/aql_native_binance_zip_v1.py'
      - 'tools/atlas_saved_daily_health.py'
      - 'tests/test_atlas_daily_source_seam.py'
      - 'tests/test_atlas_research_ws_seam.py'
      - '.github/workflows/atlas-offline-source-seams.yml'
permissions:
  contents: read
jobs:
  fixtures:
    name: Offline source seams (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2 websocket-client==1.9.2
      - name: Generated ZIP, saved health and mock websocket
        run: python -B -m pytest -q tests/test_atlas_daily_source_seam.py tests/test_atlas_research_ws_seam.py
        env:
          PYTHONPATH: src
          BINANCE_LIVE_TEST: '0'
