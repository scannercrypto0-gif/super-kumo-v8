name: ATLAS Factory F RESEARCH E2E DIAGNOSTIC (not F5)
on:
  push:
    branches:
      - factory/package-e-historical-research-results-20261105
    paths:
      - 'research_wp_r0/aql_factory_f_research_e2e_diagnostic_v1.py'
      - 'research_wp_r0/aql_factory_f_f2_recovery_diagnostic_v1.py'
      - 'research_wp_r0/aql_factory_f_f2_recovery_research_v2.py'
      - 'tests/test_aql_factory_f_research_e2e_diagnostic_v1.py'
      - 'tests/test_aql_factory_f_f2_recovery_diagnostic_v1.py'
      - 'tests/test_aql_factory_f_f2_recovery_research_v2.py'
      - '.github/workflows/atlas-factory-f-research-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-diagnostic-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify diagnostic-only input rejects missing local original data and forged F5 promotions
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aql_factory_f_research_e2e_diagnostic_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aql_factory_f_f2_recovery_diagnostic_v1.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aql_factory_f_f2_recovery_research_v2.py' -v
