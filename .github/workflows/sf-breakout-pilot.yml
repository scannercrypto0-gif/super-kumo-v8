name: SF Breakout Synthetic Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_wp_r0/sf_breakout_pilot.py'
      - 'tests/test_sf_breakout_pilot.py'
      - '.github/workflows/sf-breakout-pilot.yml'
jobs:
  synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pytest-timeout
      - name: Run focused synthetic tests (no internet market data)
        run: python -B -m pytest -p no:cacheprovider tests/test_sf_breakout_pilot.py -q --tb=short
      - name: Source identity
        run: git rev-parse HEAD
