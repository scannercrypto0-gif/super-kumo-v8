name: Historical warehouse offline acceptance
on:
  pull_request:
    paths:
      - 'src/aql/warehouse/**'
      - 'tests/test_warehouse.py'
      - 'tests/test_warehouse_september.py'
      - 'tests/test_september_correction.py'
      - 'tests/test_full_history.py'
      - 'tests/test_resilient_history.py'
      - 'tests/test_warehouse_registry.py'
      - 'tests/test_daily_warehouse_watchdog_seam.py'
      - 'tests/test_warehouse_producer_report.py'
      - 'tools/ATLAS-WAREHOUSE-*.ps1'
      - '.github/workflows/historical-warehouse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warehouse:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: scannercrypto0-gif/super-kumo-v8
          ref: 9d9e873fbaba8742280846285bd0b5db154ec455
          path: peer-watchdog
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_warehouse.py tests/test_warehouse_september.py tests/test_september_correction.py tests/test_full_history.py tests/test_resilient_history.py tests/test_warehouse_registry.py tests/test_daily_warehouse_watchdog_seam.py tests/test_warehouse_producer_report.py
      - name: Parse unified Windows entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errorsFound = $null
          Get-ChildItem tools/ATLAS-WAREHOUSE-*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errorsFound) | Out-Null
            if ($errorsFound.Count) { throw ($errorsFound | Out-String) }
          }
