name: SF Historical Input Quality
on:
  pull_request:
    branches: [main]
    paths:
      - "research_wp_r0/historical_input_quality.py"
      - "research_wp_r0/retrospective_kline_intake.py"
      - "tests/test_sf_historical_input_quality.py"
      - "tests/test_sf_retrospective_kline_intake.py"
      - ".github/workflows/sf-historical-input-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-timeout
      - name: Exact source and environment
        shell: bash
        run: |
          git rev-parse HEAD | tee quality-source.txt
          python --version | tee -a quality-source.txt
          python -m pip freeze | tee -a quality-source.txt
      - name: New input-quality boundary and shared ZIP compatibility
        run: python -B -m pytest -p no:cacheprovider tests/test_sf_historical_input_quality.py tests/test_sf_retrospective_kline_intake.py -v --tb=short --junitxml=quality-tests.xml
      - name: Require actual collection and no skips
        run: python -B -c "import xml.etree.ElementTree as E; s=E.parse('quality-tests.xml').getroot().find('testsuite'); print(s.attrib); assert int(s.get('tests'))==44; assert all(int(s.get(k,0))==0 for k in ('errors','failures','skipped'))"
      - name: Deterministic injected-fixture receipt
        run: python -B -c "import runpy; from research_wp_r0.historical_input_quality import HistoricalInputSpec,inspect_historical_input; t=runpy.run_path('tests/test_sf_historical_input_quality.py'); raw=t['encode'](t['rows']()); s=HistoricalInputSpec(t['specification'](raw)); r=inspect_historical_input(raw,s,expected_spec_digest=s.digest); assert r.payload==inspect_historical_input(raw,s,expected_spec_digest=s.digest).payload; print(r.digest); open('quality-fixture.json','w',encoding='utf-8').write(r.to_json())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-quality-${{ matrix.os }}
          path: |
            quality-source.txt
            quality-tests.xml
            quality-fixture.json
