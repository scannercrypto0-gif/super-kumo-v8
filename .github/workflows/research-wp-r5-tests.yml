name: Research WP-R5 Temporal Contract Tests

on:
  push:
    branches:
      - feat/research-wp-r5-temporal-contract-20261022

permissions:
  contents: read

jobs:
  temporal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m compileall -q research_wp_r0 tests
      - run: python3 -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
