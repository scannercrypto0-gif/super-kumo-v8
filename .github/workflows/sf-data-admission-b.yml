name: Factory Data Admission M16-M17
on:
  pull_request:
    paths:
      - 'research_wp_r0/data_admission_b.py'
      - 'tests/test_sf_data_admission_b.py'
      - 'research_wp_r0/core_proof_bridge.py'
      - 'tests/test_sf_core_proof_bridge.py'
      - 'research_wp_r0/pre_indicator_boundary.py'
      - 'tests/test_sf_pre_indicator_boundary.py'
      - 'tests/test_sf_negative_r0_integration.py'
      - 'research_wp_r0/indicator_calculation_identity.py'
      - 'tests/test_sf_indicator_calculation_identity.py'
      - 'research_wp_r0/guarded_factory_exam.py'
      - 'tests/test_sf_guarded_factory_exam.py'
      - 'tests/test_sf_m18_computed_binding.py'
      - 'tests/test_sf_m18_roc_r0_integration.py'
      - 'tests/test_sf_pit_claim_guards.py'
      - 'research_wp_r0/factory_full_synthetic_b.py'
      - 'tests/test_sf_factory_full_synthetic_b.py'
      - 'research_wp_r0/synthetic_outcome_receipt.py'
      - 'tests/test_sf_synthetic_outcome_receipt.py'
      - 'docs/research/FACTORY_DATA_ADMISSION_B.md'
      - '.github/workflows/sf-data-admission-b.yml'
  workflow_dispatch:
jobs:
  admission:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted consumer falsifiers
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_sf_data_admission_b.py tests/test_sf_core_proof_bridge.py tests/test_sf_pre_indicator_boundary.py tests/test_sf_negative_r0_integration.py tests/test_sf_indicator_calculation_identity.py tests/test_sf_guarded_factory_exam.py tests/test_sf_m18_computed_binding.py tests/test_sf_m18_roc_r0_integration.py tests/test_sf_pit_claim_guards.py tests/test_sf_factory_full_synthetic_b.py tests/test_sf_synthetic_outcome_receipt.py
