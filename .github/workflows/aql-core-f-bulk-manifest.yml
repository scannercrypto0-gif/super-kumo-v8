name: ATLAS Core F Bulk Historical Manifest and NTFS F2
on:
  push:
    branches:
      - core/package-f-bulk-source-20261105
  pull_request:
    paths:
      - 'research_wp_r0/aql_core_f_bulk_source_v1.py'
      - 'research_wp_r0/aql_core_f_ntfs_acl_v1.py'
      - 'research_wp_r0/aql_core_f_private_f2_v1.py'
      - 'tests/test_aql_core_f_bulk_source_v1.py'
      - 'tests/test_aql_core_f_ntfs_acl_v1.py'
      - 'tests/test_aql_core_f_private_f2_v1.py'
      - '.github/workflows/aql-core-f-bulk-manifest.yml'
      - 'tools/raw_vault_offline/**'
      - 'tests/test_aql_core_f5_windows_rawvault_release_v1.py'
jobs:
  core-f-source-plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core F ACL and owner-local F2 negative gate (no private data or network)
        run: |
          python -m unittest discover -s tests -p 'test_aql_core_f_bulk_source_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_core_f_ntfs_acl_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_core_f_private_f2_v1.py' -v
          python -m unittest discover -s tests -p 'test_aql_core_f5_windows_rawvault_release_v1.py' -v
  windows-ntfs-guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NTFS ACL policy and owner F2 guarded negative suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p 'test_aql_core_f_ntfs_acl_v1.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_aql_core_f_private_f2_v1.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_aql_core_f5_windows_rawvault_release_v1.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
