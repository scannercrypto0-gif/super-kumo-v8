name: Factory Synthetic Workflow Report
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_wp_r0/sf_synthetic_workflow.py'
      - 'tests/test_sf_synthetic_workflow.py'
      - '.github/workflows/sf-synthetic-workflow.yml'
jobs:
  focused-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - run: python -B -m pytest -p no:cacheprovider tests/test_sf_synthetic_workflow.py -q --tb=short
