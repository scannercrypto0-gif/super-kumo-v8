name: G2 Position Offline Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/aql/observation/positions.py'
      - 'tests/test_g2_position_lifecycle.py'
      - '.github/workflows/g2-position-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  position-contracts:
    name: G2 position contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_g2_position_lifecycle.py -v
