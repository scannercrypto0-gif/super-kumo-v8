name: G3 offline paper simulation
on:
  pull_request:
    paths:
      - 'src/aql/paper_sim/**'
      - 'tests/paper_sim/**'
      - '.github/workflows/g3-paper-sim.yml'
  push:
    branches: ['codex/g3-offline-paper-simulation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Extract two pinned upstream modules for isolated seam test
        run: python -B tests/paper_sim/fetch_pinned_upstream.py "${{ runner.temp }}/g3-upstream"
      - name: New G3 scope only, including real pinned read adapter
        run: python -B -m pytest tests/paper_sim -q --junitxml=g3-tests.xml
        env:
          G3_UPSTREAM_FILE: '${{ runner.temp }}/g3-upstream/prospective.py'
          PYTHONPATH: '.'
          BINANCE_LIVE_TEST: '0'
      - name: Measured bounded offline soak
        run: python -B -m aql.paper_sim.measure --seconds 30 --max-signals 128 --output g3-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-offline-${{ matrix.os }}
          path: |
            g3-tests.xml
            g3-soak.json
