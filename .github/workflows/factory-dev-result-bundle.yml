name: Factory DEV Result Bundle Focused
on:
  pull_request:
    paths:
      - 'research_wp_r0/dev_result_bundle.py'
      - 'tests/test_factory_dev_result_bundle.py'
      - '.github/workflows/factory-dev-result-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_factory_dev_result_bundle.py
