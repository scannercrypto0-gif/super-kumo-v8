name: Daily Warehouse Watchdog seam
on:
  pull_request:
    paths:
      - "src/aql/warehouse/daily.py"
      - "src/aql/warehouse/engine.py"
      - "src/aql/warehouse/registry.py"
      - "tests/test_daily_warehouse_watchdog_seam.py"
      - ".github/workflows/daily-warehouse-watchdog-seam.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seam:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: scannercrypto0-gif/super-kumo-v8
          ref: 9d9e873fbaba8742280846285bd0b5db154ec455
          path: peer-watchdog
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_daily_warehouse_watchdog_seam.py
