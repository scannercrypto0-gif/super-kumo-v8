name: Coinbase public source one-shot (manual, no trading)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact owner authorization: GO_COINBASE_PUBLIC_ONE_SHOT_NO_TRADING"
        required: true
        type: string
      approved_sha:
        description: "Exact approved commit SHA"
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    if: ${{ github.actor == github.repository_owner && inputs.approval == 'GO_COINBASE_PUBLIC_ONE_SHOT_NO_TRADING' && inputs.approved_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline focused source checks first
        run: python -m unittest discover -s tests -p 'test_aql_coinbase_*.py' -v
      - name: One public BTC-USD 15m REST capture, no trading
        env:
          AQL_COINBASE_PUBLIC_CAPTURE: OWNER_APPROVED_ONE_SHOT
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m research_wp_r0.aql_coinbase_public_capture --product BTC-USD --out "$RUNNER_TEMP/coinbase-evidence"
          python -c "import json,os; from research_wp_r0.aql_coinbase_evidence_verify import verify_capture; print(json.dumps(verify_capture(os.environ['RUNNER_TEMP']+'/coinbase-evidence'),sort_keys=True))"
      - name: Preserve result and raw evidence (including failed attempt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-one-shot-evidence
          path: ${{ runner.temp }}/coinbase-evidence/
          retention-days: 7
          if-no-files-found: warn
