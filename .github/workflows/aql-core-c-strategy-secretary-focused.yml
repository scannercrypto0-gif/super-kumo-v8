name: AQL Core C Strategy Secretary (TEST ONLY)
on:
  push:
    branches:
      - feature/aql-c-core-strategy-secretary-route-20261105
    paths:
      - 'research_wp_r0/aql_core_c_strategy_secretary_route_v1.py'
      - 'tests/test_aql_core_c_strategy_secretary_route_v1.py'
      - '.github/workflows/aql-core-c-strategy-secretary-focused.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_core_c_strategy_secretary_route_v1.py'
      - 'tests/test_aql_core_c_strategy_secretary_route_v1.py'
      - '.github/workflows/aql-core-c-strategy-secretary-focused.yml'
  workflow_dispatch:
jobs:
  core-c-strategy-route:
    name: Core C offline TEST_ONLY Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned RAW Vault #211 read-only
        uses: actions/checkout@v4
        with:
          ref: 7d97b09c0c6ee2650a61d523acb8d8c771a99c46
          path: _pinned_raw_211
          persist-credentials: false
      - name: Pinned Scanner Engine #227 read-only
        uses: actions/checkout@v4
        with:
          ref: b9c9ff8602e79c534402f44bce83c56ec2fa6bb9
          path: _pinned_scanner_227
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core C source→approval→consumer sealed route, adversarial/replay
        run: |
          PYTHONPATH=.:tests:_pinned_raw_211:_pinned_scanner_227 \
            python -m unittest discover -s tests -p 'test_aql_core_c_strategy_secretary_route_v1.py' -v
