name: SF Batch01 Admission Bridge
on:
  pull_request:
    paths:
      - 'research_wp_r0/batch01_admission_bridge.py'
      - 'tests/test_factory_batch01_admission_bridge.py'
      - '.github/workflows/sf-batch01-admission-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-timeout
      - name: Test synthetic frozen-plan provenance gate
        run: python -B -m pytest -p no:cacheprovider tests/test_factory_batch01_admission_bridge.py research_wp_r0/test_frozen_research_plan.py research_wp_r0/test_full_plan_ledger.py -q --tb=short
