name: Research WP-R3 Opportunity Cluster Tests

on:
  push:
    branches:
      - feat/research-wp-r3-opportunity-clusters-20261022
  pull_request:
    paths:
      - "research_wp_r0/**"
      - "tests/test_research_wp_r*.py"
      - ".github/workflows/research-wp-r3-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Print runtime
        run: python3 --version
      - name: Compile
        run: python3 -m compileall -q research_wp_r0 tests
      - name: Run R0 through R3 synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
