name: Observation authority bounded acceptance
on:
  pull_request:
    paths:
      - 'src/aql/observation_authority.py'
      - 'tests/test_observation_authority.py'
      - 'src/aql/evidence_outbox.py'
      - 'tests/test_evidence_outbox.py'
      - 'src/aql/binance_observer.py'
      - 'tests/test_observer_outbox_integration.py'
      - 'src/aql/utc_evidence.py'
      - 'src/aql/evidence_guardian.py'
      - 'src/aql/guardian_receipt.py'
      - 'src/aql/guardian_launch.py'
      - 'tests/test_guardian_hardening.py'
      - 'tests/test_guardian_launch.py'
      - 'tests/guardian_fixtures.py'
      - 'scripts/guardian_preflight.ps1'
      - 'src/aql/observer_runtime.py'
      - 'src/aql/utc_sampler.py'
      - 'scripts/sample_utc.py'
      - 'tests/test_observer_runtime.py'
      - 'scripts/binance_independent_observer.py'
      - 'scripts/evidence_guardian.py'
      - 'tests/test_observation_operational_e2e.py'
      - 'tests/test_utc_evidence.py'
      - '.github/workflows/observation-authority-acceptance.yml'
  workflow_dispatch:
jobs:
  authority:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Operational callpath fault injection (synthetic)
        run: python -m pytest -q tests/test_observation_operational_e2e.py --junitxml=operational-e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-e2e-${{ matrix.os }}-${{ matrix.python-version }}
          path: operational-e2e.xml
      - name: Fail-closed authority regression
        run: python -m unittest discover -s tests -p test_observation_authority.py -v
      - name: Binance ledger to optional outbox integration
        run: python -m unittest discover -s tests -p test_observer_outbox_integration.py -v
      - name: UTC uncertainty and expiry policy
        run: python -m unittest discover -s tests -p test_utc_evidence.py -v
      - name: Offline Guardian and replay recovery
        run: python -m unittest discover -s tests -p test_evidence_outbox.py -v
      - name: Guardian closure faults and local-only launch HOLD
        run: python -m pytest -q tests/test_guardian_hardening.py tests/test_guardian_launch.py --junitxml=guardian-closure.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-closure-${{ matrix.os }}-${{ matrix.python-version }}
          path: guardian-closure.xml
      - name: Separate snapshot process and Guardian recovery boundaries
        run: python -m pytest -q tests/test_observer_runtime.py --junitxml=runtime-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-acceptance-${{ matrix.os }}-${{ matrix.python-version }}
          path: runtime-acceptance.xml
