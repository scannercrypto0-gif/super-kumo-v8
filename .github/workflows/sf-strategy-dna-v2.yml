name: SF StrategyDNA V2 Synthetic
on:
  pull_request:
    branches: [main]
    paths:
      - "research_wp_r0/strategy_dna_v2*.py"
      - "tests/test_sf_strategy_dna_v2.py"
      - ".github/workflows/sf-strategy-dna-v2.yml"
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-timeout
      - name: Exact native source and environment
        shell: bash
        run: |
          git rev-parse HEAD | tee dna-source.txt
          git rev-parse 'HEAD^{tree}' | tee -a dna-source.txt
          python --version | tee -a dna-source.txt
          python -m pip freeze | tee -a dna-source.txt
      - name: Dependency isolation
        run: python -B research_wp_r0/_dep_guard.py research_wp_r0/strategy_dna_v2.py research_wp_r0/strategy_dna_v2_example.py
      - name: Focused synthetic acceptance
        run: python -B -m pytest -p no:cacheprovider tests/test_sf_strategy_dna_v2.py -v --tb=short --junitxml=dna-tests.xml
      - name: Require thirty tests and no skips
        run: python -B -c "import xml.etree.ElementTree as E; s=E.parse('dna-tests.xml').getroot().find('testsuite'); print(s.attrib); assert int(s.get('tests'))>=30; import unittest; assert unittest.defaultTestLoader.discover('tests', pattern='test_sf_strategy_dna_v2.py').countTestCases()==30; assert all(int(s.get(k,0))==0 for k in ('failures','errors','skipped'))"
      - name: Reproducible synthetic example
        run: python -B -m research_wp_r0.strategy_dna_v2_example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-dna-v2-${{ matrix.os }}
          path: |
            dna-source.txt
            dna-tests.xml
