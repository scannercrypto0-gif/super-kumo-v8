name: P0 Factory C2-F4 Receipt Restart
on:
  push:
    branches:
      - p0/aql-p0-historical-decision-v1
    paths:
      - 'research_wp_r0/aql_p0_c1_source.py'
      - 'research_wp_r0/aql_p0_c2_producer.py'
      - 'research_wp_r0/aql_p0_f4_ledger.py'
      - 'tests/test_p0_factory_consumer_ack_restart.py'
      - '.github/workflows/p0-factory-receipt-restart.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_p0_c1_source.py'
      - 'research_wp_r0/aql_p0_c2_producer.py'
      - 'research_wp_r0/aql_p0_f4_ledger.py'
      - 'tests/test_p0_factory_consumer_ack_restart.py'
      - '.github/workflows/p0-factory-receipt-restart.yml'
jobs:
  factory-receipt-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: python -m pip install pytest
      - name: Compile Factory/Core seam
        run: python -m compileall -q research_wp_r0/aql_p0_c1_source.py research_wp_r0/aql_p0_c2_producer.py research_wp_r0/aql_p0_f4_ledger.py tests/test_p0_factory_consumer_ack_restart.py
      - name: Run exact Factory C2-F4 restart tests
        run: python -m pytest -q -ra tests/test_p0_factory_consumer_ack_restart.py
