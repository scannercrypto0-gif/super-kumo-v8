name: Stage7 source-to-research WAIT regression
on:
  pull_request:
    paths:
      - "research_wp_r0/aql_stage7_source_research_v1.py"
      - "tests/test_stage7_source_research.py"
      - ".github/workflows/atlas-stage7-source-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Focused Stage7 tests
        run: python -m pytest -q tests/test_stage7_source_research.py
