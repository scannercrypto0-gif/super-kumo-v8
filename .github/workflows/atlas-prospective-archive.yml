name: ATLAS prospective research and archive
on:
  pull_request:
    paths:
      - 'src/aql/collector/binance_collector.py'
      - 'src/aql/observation/**'
      - 'research_wp_r0/aql_factory_prospective_read_v1.py'
      - 'tools/atlas_*'
      - 'tests/test_atlas_prospective_archive.py'
      - '.github/workflows/atlas-prospective-archive.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Targeted forward evidence regression
        if: github.base_ref == 'integration/prospective-observation-plus-archive-01'
        run: python -B -m unittest discover -s tests -p test_atlas_prospective_archive.py -k ForwardEvidence -k forward_contract -k real_scanner_receipts -v
      - name: Existing prospective and archive tests
        if: github.base_ref != 'integration/prospective-observation-plus-archive-01'
        run: python -B -m unittest discover -s tests -p test_atlas_prospective_archive.py -v
