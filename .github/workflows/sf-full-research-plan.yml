name: SF Full Research Plan
on:
  pull_request:
    paths:
      - 'research_wp_r0/frozen_research_plan.py'
      - 'research_wp_r0/test_frozen_research_plan.py'
      - 'research_wp_r0/test_full_plan_ledger.py'
      - 'research_wp_r0/frozen_attempt_writer.py'
      - 'research_wp_r0/attempt_ledger.py'
      - 'research_wp_r0/test_frozen_attempt_writer.py'
      - 'research_wp_r0/frozen_plan_reconciliation.py'
      - '.github/workflows/sf-full-research-plan.yml'
  workflow_dispatch:

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-timeout
      - name: Verify frozen research plan
        run: python -B -m pytest -p no:cacheprovider research_wp_r0/test_frozen_research_plan.py research_wp_r0/test_full_plan_ledger.py research_wp_r0/test_frozen_attempt_writer.py -v --tb=short
