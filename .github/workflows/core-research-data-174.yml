name: Core174 Factory research data only
on:
  pull_request:
    paths:
      - 'src/aql/historical/research_handoff.py'
      - 'research_wp_r0/realdev_research_data.py'
      - 'tests/test_research_handoff_174.py'
      - '.github/workflows/core-research-data-174.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - name: New data-only seam; synthetic fixtures only
        run: python -B -m pytest tests/test_research_handoff_174.py -q --tb=short --junitxml=core174.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core174-${{ matrix.os }}
          path: core174.xml
