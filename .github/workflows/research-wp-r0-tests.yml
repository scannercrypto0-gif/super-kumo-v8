name: Research WP-R0 Synthetic Tests

on:
  push:
    branches:
      - feat/research-wp-r0-synthetic-20261022

permissions:
  contents: read

jobs:
  research-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Compile research module and tests
        run: python3 -m compileall -q research_wp_r0 tests/test_research_wp_r0.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_research_wp_r0.py' -v
