name: Work original-history research integration
on:
  pull_request:
    paths:
      - 'tools/historical_research_integration/**'
      - '.github/workflows/aql-historical-research-integration.yml'
permissions:
  contents: read
jobs:
  consolidated-cross-owner:
    # #251 runs only its new evidence-contract gate; accepted research is frozen.
    if: ${{ !contains(github.event.pull_request.title, '[WORK #251]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          ref: '607e88d69e9450ae66fd5090317c5c296ade8457'
          path: '.history-pins/work'
      - uses: actions/checkout@v4
        with:
          ref: '668b02074621a3671b3485625ca264a987afe955'
          path: '.history-pins/core'
      - uses: actions/checkout@v4
        with:
          ref: '7803a12cdb0c7bfead0b50c521d9110c6254d383'
          path: '.history-pins/factory'
      - uses: actions/checkout@v4
        with:
          ref: 'f2006c0e431690ccea8b0532095bf4f2a2dc88ba'
          path: '.history-pins/discoverer'
      - name: ONE consolidated Core Discoverer Factory gate (TEST_ONLY)
        run: |
          python -m tools.historical_research_integration.gate \
            --checkout main=. \
            --checkout work=.history-pins/work \
            --checkout core=.history-pins/core \
            --checkout factory=.history-pins/factory \
            --checkout discoverer=.history-pins/discoverer \
            --output historical-research-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: history-integration-TEST-ONLY-${{ github.event.pull_request.head.sha }}-py${{ matrix.python }}
          path: |
            historical-research-evidence/
            tools/historical_research_integration/fixtures/
            tools/historical_research_integration/SOURCE_ACCESS_OBSERVATION.json
          retention-days: 7
          if-no-files-found: error
