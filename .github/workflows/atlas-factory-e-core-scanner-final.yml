name: ATLAS Factory E Core and Scanner Final Historical Policy Boundary
on:
  push:
    branches:
      - factory/package-e-historical-research-results-20261105
    paths:
      - 'research_wp_r0/aql_factory_e_core_scanner_historical_wait_v1.py'
      - 'tests/test_aql_factory_e_core_scanner_historical_wait_v1.py'
      - '.github/workflows/atlas-factory-e-core-scanner-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-policy-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 3af5b66d2b381b853a6b5be32c38b3d3d02e1ea7, path: _pinned_core_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 730b096f9d214bc2939f0534c003c7554660ce51, path: _pinned_scanner_e, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 6acbcc7fc243b132f58170df4c6469bbf7f4eff8, path: _pinned_work235, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 30c37ae56851488b882998c7fa0085ec51dbfc92, path: _pinned_scanner_b, persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stage missing immutable owner interfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile,copytree
          for owner in ('_pinned_core_e','_pinned_scanner_e','_pinned_work235','_pinned_scanner_b'):
              for folder in ('research_wp_r0','tools'):
                  p=Path(owner)/folder
                  if p.is_dir():
                      for src in p.rglob('*.py'):
                          dst=Path(folder)/src.relative_to(p)
                          if not dst.exists():
                              dst.parent.mkdir(parents=True,exist_ok=True)
                              copyfile(src,dst)
          copytree('_pinned_work235/tools/strategy_service_offline/fixtures',
                   'tools/strategy_service_offline/fixtures',dirs_exist_ok=True)
          PY
      - name: Owner E historical source and proposal denial
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aql_factory_e_core_scanner_historical_wait_v1.py' -v
