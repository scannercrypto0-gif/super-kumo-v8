name: Factory DEV Input Preflight
on:
  pull_request:
    paths:
      - 'research_wp_r0/dev_input_preflight.py'
      - 'research_wp_r0/historical_dev_exits_v1.py'
      - 'tests/test_factory_dev_input_preflight.py'
      - '.github/workflows/factory-dev-input-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_factory_dev_input_preflight.py tests/test_factory_dev_result_bundle.py
