name: anti-redo-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-assignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused offline gate tests
        run: python -m unittest discover -s tools/pm -p 'test_anti_redo_gate.py' -v
      - name: Validate existing assignment records and changed source paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            changed=()
          fi
          python tools/pm/anti_redo_gate.py --root . --changed "${changed[@]}"
