name: Strategy Discoverer Offline CI

on:
  push:
    branches:
      - feat/strategy-discoverer-v1
    paths:
      - 'tools/strategy_discoverer_offline/**'
      - 'research_wp_r0/**'
      - '.github/workflows/discoverer-offline-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tools/strategy_discoverer_offline/**'
      - 'research_wp_r0/**'
      - '.github/workflows/discoverer-offline-ci.yml'

# Governance: This workflow runs OFFLINE tests only.
# No live data, no real trading, no Scanner integration, no Holdout.
# _SCANNER_P0_UNRESOLVED=True blocks all real nominations.
# All test evidence is TEST_ONLY_SYNTHETIC.

jobs:
  test-discoverer-offline:
    name: "Discoverer Offline Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install project in editable mode if pyproject.toml / setup.py present
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi

      - name: Confirm P0 guard is active
        run: |
          python -c "
          from tools.strategy_discoverer_offline.scanner_adapter import _SCANNER_P0_UNRESOLVED
          assert _SCANNER_P0_UNRESOLVED is True, 'P0 guard must be True — no live nominations'
          print('P0 guard: ACTIVE (_SCANNER_P0_UNRESOLVED=True)')
          "

      - name: Run Strategy Discoverer Offline test suite
        run: |
          python -m pytest tools/strategy_discoverer_offline/tests/ \
            -v \
            --tb=short \
            -q \
            --no-header \
            2>&1

      - name: Summarise results
        if: always()
        run: |
          echo "=== ATLAS Quant Lab — Discoverer Offline CI ==="
          echo "Python: ${{ matrix.python-version }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Scope: tools/strategy_discoverer_offline/** (OFFLINE ONLY)"
          echo "Guard: _SCANNER_P0_UNRESOLVED=True (no live data)"
