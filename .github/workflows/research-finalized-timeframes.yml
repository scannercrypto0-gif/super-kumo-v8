name: Research finalized timeframe offline checks
on:
  pull_request:
    paths:
      - "src/aql/research_timeframes.py"
      - "tests/test_research_timeframes.py"
      - ".github/workflows/research-finalized-timeframes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalized-timeframes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e ".[dev]"
      - name: Focused research timeframe tests
        run: python -m pytest -q tests/test_research_timeframes.py
