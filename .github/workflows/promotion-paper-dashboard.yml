name: Promotion Paper Dashboard focused
on:
  push:
    branches: [codex/g3-offline-paper-simulation]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -B -m pytest tests/promotion -q --junitxml=promotion-junit.xml
        env:
          PYTHONPATH: "."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-paper-${{ matrix.os }}
          path: promotion-junit.xml
