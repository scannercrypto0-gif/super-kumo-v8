name: ATLAS Stage 6 durable source custody
on:
  pull_request:
    paths:
      - tools/atlas_stage6_durable.py
      - tools/atlas_stage6_cleanup.ps1
      - tests/test_stage6_durable.py
      - .github/workflows/atlas-stage6-durable.yml
permissions:
  contents: read
jobs:
  changed-seam:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -B -m pytest tests/test_stage6_durable.py -q
