name: SF Synthetic Result Ledger Link
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_wp_r0/sf_synthetic_result_link.py'
      - 'tests/test_sf_synthetic_result_link.py'
      - '.github/workflows/sf-synthetic-result-link.yml'
jobs:
  focused-synthetic-ledger-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run ledger-link synthetic tests
        run: python -B -m pytest -p no:cacheprovider tests/test_sf_synthetic_result_link.py -q --tb=short
