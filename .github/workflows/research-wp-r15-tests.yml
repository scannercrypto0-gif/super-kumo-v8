name: Research WP-R15 Evidence Telemetry Isolation

on:
  push:
    branches:
      - feat/research-wp-r15-isolated-telemetry-20261022
  pull_request:
    paths:
      - "research_wp_r0/**"
      - "tests/test_research_wp_r*.py"
      - ".github/workflows/research-wp-r15-tests.yml"

permissions:
  contents: read

jobs:
  telemetry-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Full research regression suite
        run: python -B -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
      - name: Measured evidence telemetry isolation
        run: python -B -m research_wp_r0.isolated_telemetry
