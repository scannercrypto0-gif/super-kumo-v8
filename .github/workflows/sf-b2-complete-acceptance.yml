name: SF B2 Complete Acceptance
on:
  pull_request:
    paths:
      - 'research_wp_r0/**'
      - 'tests/test_sf_*.py'
      - 'integration_tests/**'
      - '.github/workflows/sf-b2-complete-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-factory-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pytest-timeout
      - name: Verify exact revision and syntax
        run: |
          git rev-parse HEAD
          python -m compileall -q research_wp_r0 tests integration_tests
      - name: Complete Factory tests and explicit cross-module integration
        run: python -c "import pathlib,pytest,sys; paths=sorted(str(p) for p in pathlib.Path('tests').glob('test_sf_*.py')); sys.exit(pytest.main(['-p','no:cacheprovider','-q',*paths,'integration_tests/test_sf_strat_ind02.py']))"
      - name: Full synthetic B2 nine-case replay and report
        run: python -m research_wp_r0.factory_b2_counterfactual > factory-b2-all-cases.json
      - uses: actions/upload-artifact@v4
        with:
          name: b2-complete-${{ matrix.os }}-${{ matrix.python-version }}
          path: factory-b2-all-cases.json
          if-no-files-found: error
