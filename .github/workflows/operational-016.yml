name: Operational016 report-only monitor
on:
  pull_request:
    paths:
      - 'tools/atlas_operational_016.py'
      - 'tools/ATLAS-OPERATIONAL-016.ps1'
      - 'tests/test_operational_016.py'
      - '.github/workflows/operational-016.yml'
permissions:
  contents: read
jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" websocket-client==1.9.2 pytest==9.2.0 pytest-timeout==2.4.0
      - run: python -m pytest -q --timeout=60 tests/test_operational_016.py tests/test_mcp_refresh.py tests/test_mcp_producer_link.py --junitxml=operational016.xml
      - shell: pwsh
        run: |
          $errorsFound=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/ATLAS-OPERATIONAL-016.ps1),[ref]$null,[ref]$errorsFound)
          if($errorsFound.Count){throw ($errorsFound|Out-String)}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational016-${{ matrix.os }}-${{ matrix.python }}
          path: operational016.xml
