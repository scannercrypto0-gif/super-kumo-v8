name: SF-IND-01 Fast Tests

on:
  push:
    branches:
      - feat/research-sf-ind-01
      - fix/research-sf-ind-01-ci-guard-20261024
  pull_request:
    branches:
      - main
    paths:
      - "research_wp_r0/indicator_library.py"
      - "research_wp_r0/_dep_guard.py"
      - "tests/test_sf_ind_01.py"
      - "tests/test_sf_dep_guard.py"
      - ".github/workflows/sf-ind-01-fast.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason (e.g. post-merge CI validation)"
        required: false
        default: "manual"

jobs:
  test:
    name: SF-IND-01 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify no external dependencies in indicator library
        # Calls the extracted, testable guard module — same code as the tests.
        # Previously: inline python -c with names[0]-only bug (caught research_wp_r0
        # as a false positive AND missed multi-alias imports like 'import os, numpy').
        run: python research_wp_r0/_dep_guard.py research_wp_r0/indicator_library.py

      - name: Run SF-IND-01 indicator tests
        # Single-line: backslash continuation is bash-only; PowerShell (Windows) rejects it.
        run: python -m pytest tests/test_sf_ind_01.py -v --tb=short --junit-xml=test-results-sf-ind-01.xml

      - name: Run SF-IND-01 dependency-guard regression tests
        # Single-line: same Windows/PowerShell compatibility reason.
        run: python -m pytest tests/test_sf_dep_guard.py -v --tb=short --junit-xml=test-results-sf-dep-guard.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-ind-01-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results-sf-ind-01.xml
            test-results-sf-dep-guard.xml
          retention-days: 7
