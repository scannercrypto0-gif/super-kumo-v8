name: Factory authentic research admission focused
on:
  push:
    paths:
      - 'research_wp_r0/aql_factory_authentic_research_admission.py'
      - 'tests/test_aql_factory_authentic_research_admission.py'
      - '.github/workflows/aql-factory-authentic-research-admission.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_factory_authentic_research_admission.py'
      - 'tests/test_aql_factory_authentic_research_admission.py'
      - '.github/workflows/aql-factory-authentic-research-admission.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Factory source-admission adversarial gate
        run: python -m unittest discover -s tests -p 'test_aql_factory_authentic_research_admission.py' -v
