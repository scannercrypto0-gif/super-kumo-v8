name: Realtime feed offline tests

on:
  pull_request:
    paths:
      - "tools/realtime_market_feed/**"
      - ".github/workflows/realtime-market-feed.yml"
      - "docs/research/realtime-daily-warehouse-integration.md"
  push:
    branches: [main, codex/realtime-market-feed-e-20261125]
    paths:
      - "tools/realtime_market_feed/**"
      - ".github/workflows/realtime-market-feed.yml"
      - "docs/research/realtime-daily-warehouse-integration.md"

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: scannercrypto0-gif/super-kumo-v8
          ref: ae60b3e367241fec14753ac78e08147603b7af84
          path: .integration/warehouse
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: scannercrypto0-gif/super-kumo-v8
          ref: 9d9e873fbaba8742280846285bd0b5db154ec455
          path: .integration/watchdog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/realtime_market_feed/requirements.txt pytest
      - name: Run feed and integration fixture suites
        run: python -m pytest --timeout=60 tools/realtime_market_feed/test_service.py tools/realtime_market_feed/test_backfill.py tools/realtime_market_feed/test_atlas_integration.py tools/realtime_market_feed/test_acceptance_gates.py -q
      - name: Build machine-readable isolated evidence
        run: python -B -m tools.realtime_market_feed.integration_acceptance --output integration-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-integration-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: integration-evidence.json
          if-no-files-found: warn
