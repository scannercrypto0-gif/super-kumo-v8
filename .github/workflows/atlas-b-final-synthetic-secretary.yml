name: ATLAS B Full Synthetic G1 Scanner G2 Secretary

on:
  push:
    branches:
      - integration/atlas-b-final-synthetic-secretary-20261109
  pull_request:
    paths:
      - tests/test_atlas_b_full_synthetic_secretary_e2e_v1.py
      - .github/workflows/atlas-b-final-synthetic-secretary.yml

permissions:
  contents: read

jobs:
  atlas-b-single-gate:
    name: Full B synthetic (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout immutable actual Scanner #277
        uses: actions/checkout@v4
        with:
          ref: 0251dc0bb89eb9e501225653a85f7ead90ce06a8
          path: scanner-ref
          persist-credentials: false
      - name: Run exactly one contiguous synthetic Integration test
        shell: bash
        env:
          AQL_PINNED_SCANNER_ROOT: scanner-ref
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_atlas_b_full_synthetic_secretary_e2e_v1.py' -v
