name: Factory First DEV Integrated Focused
on:
  pull_request:
    paths:
      - 'research_wp_r0/historical_dev_exits_v1.py'
      - 'research_wp_r0/dev_result_bundle.py'
      - 'tests/test_factory_dev_b0_warmup_252.py'
      - 'tests/test_factory_terminal_unknown_entry.py'
      - 'tests/test_factory_182_legacy_receipts.py'
      - 'tests/test_factory_dev_result_bundle.py'
      - '.github/workflows/factory-first-dev-integrated-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_factory_dev_b0_warmup_252.py tests/test_factory_terminal_unknown_entry.py tests/test_factory_182_legacy_receipts.py tests/test_factory_dev_result_bundle.py
