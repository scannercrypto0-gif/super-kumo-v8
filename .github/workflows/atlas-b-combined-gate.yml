name: ATLAS Bundle B cross-PR isolated software contract gate
on:
  push:
    branches:
      - integration/atlas-b-combined-gate-20261104
    paths:
      - '.github/workflows/atlas-b-combined-gate.yml'
      - 'tests/test_aql_bundle_b_combined_gate_v1.py'
      - 'research_wp_r0/aql_core_dual_query_identity_map_v1.py'
      - 'research_wp_r0/aql_factory_core_query_bridge_v1.py'
      - 'tools/scanner_strategy_b/**'
permissions:
  contents: read
jobs:
  combined-software-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage exact Core RAW code-only dependency without changing owner branch
        uses: actions/checkout@v4
        with:
          ref: 7d97b09c0c6ee2650a61d523acb8d8c771a99c46
          path: _core_raw_dependency
          persist-credentials: false
      - name: Resolve pinned Core RAW dependency
        run: |
          set -euo pipefail
          test "$(git -C _core_raw_dependency rev-parse HEAD)" = "7d97b09c0c6ee2650a61d523acb8d8c771a99c46"
          test -d _core_raw_dependency/tools/raw_vault_offline
          if [ ! -d tools/raw_vault_offline ]; then
            cp -a _core_raw_dependency/tools/raw_vault_offline tools/
          fi
          echo "Pinned RAW code only, no original price bytes"
      - name: Stage pinned Core #226 and Factory #255 code-only dependencies
        uses: actions/checkout@v4
        with:
          ref: 1b165f85ab0dc21e14d9150764125d92a3b0b568
          path: _pinned_core226
          persist-credentials: false
      - name: Stage pinned Factory #255 code-only dependencies
        uses: actions/checkout@v4
        with:
          ref: e66ac39a6443853c60463f7bd5bfaf590bb125a6
          path: _pinned_factory255
          persist-credentials: false
      - name: Merge missing code-only dependency modules without changing owner sources
        run: |
          set -euo pipefail
          test "$(git -C _pinned_core226 rev-parse HEAD)" = "1b165f85ab0dc21e14d9150764125d92a3b0b568"
          test "$(git -C _pinned_factory255 rev-parse HEAD)" = "e66ac39a6443853c60463f7bd5bfaf590bb125a6"
          python - <<'PY'
          from pathlib import Path
          import shutil
          for name in ('_pinned_core226', '_pinned_factory255'):
              for root in ('research_wp_r0', 'src', 'tools'):
                  source=Path(name)/root
                  if not source.is_dir(): continue
                  for p in source.rglob('*.py'):
                      target=Path(root)/p.relative_to(source)
                      if not target.exists():
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(p,target)
          print("Only missing Python modules from exact owner commits staged")
          PY
      - name: Stage exact pinned test fixtures without executing old suites
        run: |
          set -euo pipefail
          cp _pinned_core226/tests/test_aql_core_authorized_source_transfer_v1.py tests/
          echo "Only helper fixture imported by cross-PR Core tests"
          PY
      - name: Check SHA-pinned ownership and code-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("docs/research/atlas-b-combined-pin-manifest-v1.json").read_text())
          assert m["execution_mode"]=="SYNTHETIC_SOFTWARE_ONLY"
          assert m["operational_paper"]=="NOT_CONNECTED_15M_UNSUPPORTED"
          assert m["authentic_new_source_e2e"]=="SOURCE_UNAVAILABLE"
          assert len(m["owners"])==3
          print("SOURCE_UNAVAILABLE for genuine new monthly source; software gate proceeds")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: One combined cross-PR software-contract test batch
        run: |
          PYTHONPATH="$PWD:$PWD/tests" python -m unittest -v tests/test_aql_bundle_b_combined_gate_v1.py
