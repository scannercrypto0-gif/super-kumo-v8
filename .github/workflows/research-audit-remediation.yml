name: Research Audit Remediation Tests

on:
  push:
    branches:
      - fix/research-wp-r4-statistical-audit-20261022

permissions:
  contents: read

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python runtime
        run: python3 --version
      - name: Compile
        run: python3 -m compileall -q research_wp_r0 tests
      - name: R0-R3 full regression suite
        run: python3 -m unittest discover -s tests -p 'test_research_wp_r*.py' -v
