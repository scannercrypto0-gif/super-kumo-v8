name: ATLAS Binance composite evidence
on:
  push:
    branches: [integration/binance-composite-20261111]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: src${{ matrix.os == 'windows-latest' && ';' || ':' }}.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify stack and mount historical package
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin e0e08a8381a8cceaaa44d6ae2721e9cb0d004648
          test "$(git rev-parse HEAD^)" = e440b91f05becc1a523e8249d341874d4c5f6434
          test "$(git merge-base HEAD 1ff3d13a3dfd1337bae0659dd03550b764c8799c)" = 1ff3d13a3dfd1337bae0659dd03550b764c8799c
          test "$(git merge-base HEAD 90af9794880cbeb00e7e974bfa906ff5e9666183)" = 90af9794880cbeb00e7e974bfa906ff5e9666183
          git restore --source e0e08a8381a8cceaaa44d6ae2721e9cb0d004648 -- tools/historical_source_qa
      - run: python -m pip install pytest==9.0.2
      - name: Replay joined fixture twice
        shell: bash
        run: |
          set -euo pipefail
          python -B .github/atlas_evidence/binance_composite/replay.py joined-evidence | tee joined-replay.log
          grep -Fx 'PASS_COMBINED_OFFLINE SHA256=d45e5fbc456bfc341330d3e9e38427e653553fc44d7d590ef254b7f5a67316e3 repeats=2 failures=0 skips=0' joined-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-composite-${{ matrix.os }}
          path: |
            joined-replay.log
            joined-evidence/*/receipt.json
