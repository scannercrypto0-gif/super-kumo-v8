name: Discoverer D-SCAN-1 synthetic candidate bridge

on:
  push:
    branches:
      - feat/discoverer-package-f4-original-cohort-contract-20261105
    paths:
      - tools/strategy_discoverer_offline/synthetic_scanner_candidate_bridge.py
      - tools/strategy_discoverer_offline/tests/test_d_scan_1_candidate_bridge.py
      - .github/workflows/discoverer-d-scan-1.yml
  pull_request:
    paths:
      - tools/strategy_discoverer_offline/synthetic_scanner_candidate_bridge.py
      - tools/strategy_discoverer_offline/tests/test_d_scan_1_candidate_bridge.py
      - .github/workflows/discoverer-d-scan-1.yml
jobs:
  d-scan-1:
    name: D-SCAN-1 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Stage exact pinned Scanner H code, CI-only, no PR merge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          repo = "https://raw.githubusercontent.com/scannercrypto0-gif/super-kumo-v8/"
          ref = "3c82448702c9ae35783716e4e2c3b640010db97c"
          expected = {
              "tools/scanner_strategy_f/research_strategy_plugin.py": "873e4ed37c50fe225555e208958bfe6674c4bcfd",
              "tools/scanner_strategy_f/research_e2e_diagnostic.py": "0021f1c3137bb31c7d02de3d114b23d304cd1319",
              "tools/scanner_strategy_f/frozen_diagnostic_contracts.py": "ada5d3e790861bbde24f6b8ad415a1af71dcc857",
              "tools/scanner_strategy_f/retrospective_policy.py": "9fb468ac6450f4389c24897aacba8c39b2e3bb30",
              "tools/scanner_strategy_e/historical_research_policy.py": "2d7720eb6cbbc5d40cd9914c97f28604c90cfc31",
              "tools/scanner_strategy_e/historical_policy_approval_request.py": "1b4fef75b415695b0e92cd9340e7ba96229edcbb",
          }
          import urllib.request
          for name, git_blob_sha1 in expected.items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(repo + ref + "/" + name, timeout=30) as response:
                  data = response.read()
              git_sha = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()
              if git_sha != git_blob_sha1:
                  raise SystemExit("PINNED_SCANNER_GIT_BLOB_MISMATCH: " + name)
              dest.write_bytes(data)
          PY
      - name: Test new synthetic bridge only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tools/strategy_discoverer_offline/tests/test_d_scan_1_candidate_bridge.py
