name: Factory historical rule projection focused

on:
  push:
    paths:
      - 'research_wp_r0/aql_factory_historical_rule_projection.py'
      - 'research_wp_r0/aql_factory_authentic_research_admission.py'
      - 'tests/test_aql_factory_historical_rule_projection.py'
      - '.github/workflows/aql-factory-historical-rule-projection.yml'
  pull_request:
    paths:
      - 'research_wp_r0/aql_factory_historical_rule_projection.py'
      - 'research_wp_r0/aql_factory_authentic_research_admission.py'
      - 'tests/test_aql_factory_historical_rule_projection.py'
      - '.github/workflows/aql-factory-historical-rule-projection.yml'

jobs:
  factory-historical-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused Factory rule, admission and compatibility regression
        run: python -m unittest discover -s tests -p 'test_aql_factory_*.py' -v
