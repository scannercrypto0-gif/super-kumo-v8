name: ATLAS Factory E Research Results Store Focused Gate
on:
  push:
    branches:
      - factory/package-e-historical-research-results-20261105
    paths:
      - 'research_wp_r0/aql_factory_e_*.py'
      - 'tests/test_aql_factory_e_*.py'
      - '.github/workflows/atlas-factory-e-results-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-e-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused Factory E storage, safety, replay and immutable parent tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aql_factory_e_research_results_store_v1.py' -v
