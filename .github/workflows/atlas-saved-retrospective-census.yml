name: ATLAS saved retrospective census
on:
  pull_request:
    branches: [main]
    paths:
      - 'research_wp_r0/aql_factory_e_research_results_store_v1.py'
      - 'tools/atlas_saved_retrospective_census.py'
      - 'tests/test_atlas_saved_retrospective_census.py'
      - '.github/workflows/atlas-saved-retrospective-census.yml'
permissions:
  contents: read
jobs:
  fixtures:
    name: Saved retrospective census (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2
      - run: python -B -m pytest -q tests/test_atlas_saved_retrospective_census.py
        env:
          PYTHONPATH: src
          BINANCE_LIVE_TEST: '0'
